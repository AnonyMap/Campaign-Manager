[workspace]
resolver = "3"
members = ["crates/cm_core", "crates/cm_app"]

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Campaign Manager contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
